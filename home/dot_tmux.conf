# Truecolor: tmux-256color has the right terminfo; the override forces RGB
# for terminals whose terminfo doesn't advertise it.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# C-a prefix (C-b is awkward and C-a is free since we don't use screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
setw -g mode-keys vi
set -g history-limit 100000

# Required for Neovim's FocusGained autocmd (autoread of agent-edited files)
set -g focus-events on

# Don't delay Esc; matters a lot inside Neovim
set -sg escape-time 10

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-clipboard on

# Splits and new windows keep the current pane's working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vi-style copy mode: v to select, y to yank
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Minimal status line
set -g status-style "bg=default,fg=colour244"
set -g status-left "[#S] "
set -g status-right "#h %H:%M"
setw -g window-status-current-style "fg=colour255,bold"
